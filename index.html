<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuliverse - Stream Movies & Series</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Header & Search Bar Setup */
        header { 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 4%; 
            background: #111827; 
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 10px;
        }
        .logo { font-size: 20px; font-weight: 800; color: #e11d48; letter-spacing: 1px; }
        .search-box { width: 100%; max-width: 260px; }
        .search-box input { 
            width: 100%;
            padding: 7px 12px; 
            border-radius: 20px; 
            border: 1px solid #374151; 
            background: #1f2937;
            color: #fff;
            outline: none; 
            font-size: 13px;
        }
        .search-box input:focus { border-color: #e11d48; }

        /* Mobile Column Grid (3-4 Columns Layout) */
        .container { padding: 12px 2%; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #f3f4f6; padding-left: 4px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* Mobile default: 3 Columns */
            gap: 8px; 
        }

        /* Very Small Mobile Screens (3 Columns) */
        @media (max-width: 360px) {
            .grid { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 6px; 
            }
        }

        /* Normal Mobile Screens (4 Columns) */
        @media (min-width: 480px) and (max-width: 767px) {
            .grid { 
                grid-template-columns: repeat(4, 1fr); 
                gap: 8px; 
            }
        }

        /* Tablets & Laptops (5 to 6 Columns) */
        @media (min-width: 768px) {
            header { padding: 12px 5%; }
            .container { padding: 20px 4%; }
            .search-box { width: auto; }
            .grid { 
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
                gap: 16px; 
            }
        }

        /* Movie Card Design for Small Columns */
        .card { 
            background: #1f2937; 
            border-radius: 6px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.2s; 
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-3px); }
        
        .card img { 
            width: 100%; 
            height: 140px; /* Smaller height for 3/4 columns */
            object-fit: cover; 
            display: block; 
        }

        @media (min-width: 480px) {
            .card img { height: 170px; }
        }
        @media (min-width: 768px) {
            .card img { height: 220px; }
        }

        .card-info { padding: 6px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f9fafb; }
        .card-rating { font-size: 10px; color: #fbbf24; margin-top: 2px; }

        /* Video Player Modal */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.95); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 10px;
        }
        .modal-content { 
            position: relative; 
            width: 100%; 
            max-width: 850px; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
        }
        .close-btn { 
            position: absolute; 
            top: 5px; 
            right: 12px; 
            color: #fff; 
            font-size: 28px; 
            cursor: pointer; 
            z-index: 1001; 
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            padding: 0 8px;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TULIVERSE</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search movie..." onkeyup="searchMovie()">
        </div>
    </header>

    <div class="container">
        <h2>Trending Movies</h2>
        <div class="grid" id="movieGrid"></div>
    </div>

    <!-- Embedded Player -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <div class="iframe-container">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'e64b892cb94d9ddd0616e9998422ed9a';
        const READ_ACCESS_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlNjRiODkyY2I5NGQ5ZGRkMDYxNmU5OTk4NDIyZWQ5YSIsIm5iZiI6MTc5MzAwNTc1MS40MjIwMDAyLCJzdWIiOiI2YWRmMThiNzA4OWFmMWY4ODFlMWUxM2QiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.AAGzkIhl_V950fMfxr35gfw3Cf9qdVZLOo9pwUAgqwo';
        
        const API_URL = `https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}`;
        const SEARCH_URL = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=`;
        const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

        const movieGrid = document.getElementById('movieGrid');
        const playerModal = document.getElementById('playerModal');
        const videoFrame = document.getElementById('videoFrame');

        const fetchOptions = {
            method: 'GET',
            headers: {
                accept: 'application/json',
                Authorization: `Bearer ${READ_ACCESS_TOKEN}`
            }
        };

        async function getMovies(url) {
            try {
                const res = await fetch(url, fetchOptions);
                const data = await res.json();
                showMovies(data.results);
            } catch (error) {
                console.error("Error fetching data: ", error);
            }
        }

        function showMovies(movies) {
            movieGrid.innerHTML = '';
            if(!movies || movies.length === 0) {
                movieGrid.innerHTML = '<p style="color: #9ca3af; grid-column: 1/-1;">No movies found.</p>';
                return;
            }

            movies.forEach(movie => {
                const { id, title, poster_path, vote_average } = movie;
                if(!poster_path) return;
                
                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `
                    <img src="${IMG_PATH + poster_path}" alt="${title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-rating">⭐ ${vote_average ? vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                card.onclick = () => playMovie(id);
                movieGrid.appendChild(card);
            });
        }

        function playMovie(movieId) {
            videoFrame.src = `https://vidsrc.to/embed/movie/${movieId}`;
            playerModal.style.display = 'flex';
        }

        function closePlayer() {
            playerModal.style.display = 'none';
            videoFrame.src = '';
        }

        function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if(query.length > 2) {
                getMovies(SEARCH_URL + encodeURIComponent(query));
            } else if(query.length === 0) {
                getMovies(API_URL);
            }
        }

        getMovies(API_URL);
    </script>
</body>
</html>
