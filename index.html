<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Content Search Engine</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      color: #e50914;
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 650px;
      margin: 0 auto;
    }
    input[type="text"] {
      width: 75%;
      padding: 12px 15px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      border-radius: 5px;
      font-size: 16px;
      outline: none;
    }
    button {
      padding: 12px 25px;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #b80710;
    }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }
    .movie-card {
      background: #181818;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      border: 1px solid #282828;
    }
    .movie-card img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 6px;
    }
    .movie-card h3 {
      font-size: 18px;
      margin: 12px 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-card p {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .movie-card iframe {
      width: 100%;
      height: 220px;
      border: none;
      border-radius: 6px;
      background: #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Cinema Search (No Filters)</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="যেকোনো কিছু লিখে সার্চ করুন...">
      <button onclick="searchMovies()">Search</button>
    </div>
  </header>

  <div class="movie-grid" id="movieContainer">
    <p style="text-align: center; grid-column: 1/-1; color: #888;">সার্চ বক্সে যেকোনো নাম লিখুন...</p>
  </div>

  <script>
    const apiKey = '15d2ea6d0dc1d476efb2532d8b1b5120'; 

    function searchMovies() {
      const query = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('movieContainer');

      if (!query) {
        alert('দয়া করে কিছু লিখুন!');
        return;
      }

      container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">খোঁজা হচ্ছে...</p>';

      // include_adult=true দিয়ে সব ধরনের কন্টেন্ট ফিল্টার মুক্ত রাখা হয়েছে
      const url = `https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${encodeURIComponent(query)}&include_adult=true`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          container.innerHTML = '';

          if (!data.results || data.results.length === 0) {
            container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">কোনো ফলাফল পাওয়া যায়নি!</p>';
            return;
          }

          data.results.forEach(item => {
            const title = item.title || item.name || item.original_title || item.original_name;
            const mediaType = item.media_type ? item.media_type.toUpperCase() : 'UNKNOWN';
            
            const poster = item.poster_path || item.profile_path
              ? `https://image.tmdb.org/t/p/w500${item.poster_path || item.profile_path}` 
              : 'https://via.placeholder.com/500x750?text=No+Poster';
            
            const releaseDate = item.release_date || item.first_air_date || 'N/A';
            
            // Player Embed Source
            const embedUrl = item.media_type === 'tv'
              ? `https://vidsrc.to/embed/tv/${item.id}`
              : `https://vidsrc.to/embed/movie/${item.id}`;

            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
              <img src="${poster}" alt="${title}">
              <h3>${title}</h3>
              <p>Type: ${mediaType} | Release: ${releaseDate}</p>
              <iframe src="${embedUrl}" allowfullscreen></iframe>
            `;

            container.appendChild(card);
          });
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: red;">ডাটা লোড করতে সমস্যা হয়েছে!</p>';
        });
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        searchMovies();
      }
    });
  </script>

</body>
</html>
