<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Tuliverse - Stream Movies & Series</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        header { 
            background: #111827; 
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 4%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .logo { font-size: 20px; font-weight: 800; color: #e11d48; letter-spacing: 1px; }
        .search-box { width: 100%; max-width: 250px; }
        .search-box input { 
            width: 100%;
            padding: 7px 12px; 
            border-radius: 20px; 
            border: 1px solid #374151; 
            background: #1f2937;
            color: #fff;
            outline: none; 
            font-size: 13px;
        }
        .search-box input:focus { border-color: #e11d48; }

        .filters-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .categories, .years {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar, .years::-webkit-scrollbar { display: none; }
        
        .cat-btn, .year-btn {
            background: #1f2937;
            color: #d1d5db;
            border: 1px solid #374151;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active, .year-btn.active, .cat-btn:hover, .year-btn:hover {
            background: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }

        .container { padding: 12px 2%; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #f3f4f6; padding-left: 4px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        @media (max-width: 360px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        }

        @media (min-width: 480px) and (max-width: 767px) {
            .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
        }

        @media (min-width: 768px) {
            header { padding: 12px 5%; }
            .container { padding: 20px 4%; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        }

        .card { 
            background: #1f2937; 
            border-radius: 6px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.2s; 
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card:hover { transform: translateY(-3px); }
        
        .card img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
            display: block; 
        }

        @media (min-width: 480px) { .card img { height: 170px; } }
        @media (min-width: 768px) { .card img { height: 220px; } }

        .type-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(225, 29, 72, 0.9);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .card-info { padding: 6px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f9fafb; }
        .card-rating { font-size: 10px; color: #fbbf24; margin-top: 2px; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 25px 0 10px 0;
        }
        .page-btn {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        .page-btn:hover { background: #e11d48; border-color: #e11d48; }
        .page-info { font-size: 13px; font-weight: bold; color: #e11d48; }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.93); 
            z-index: 1000; 
            padding: 10px;
            overflow-y: auto;
        }
        .modal-dialog {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100%;
        }
        .modal-content { 
            position: relative; 
            width: 100%; 
            max-width: 920px; 
            background: #0f172a; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #1e293b;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            margin: 15px 0;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .player-title {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }
        .close-btn { 
            color: #94a3b8; 
            font-size: 26px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .close-btn:hover { color: #e11d48; }

        .server-top-bar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            overflow-x: auto;
            white-space: nowrap;
        }
        .srv-btn {
            background: #1f2937;
            color: #d1d5db;
            border: 1px solid #374151;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .srv-btn.active {
            background: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .episodes-section {
            padding: 12px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: none;
        }
        .episodes-title {
            font-size: 13px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .ep-btn {
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .ep-btn.active, .ep-btn:hover {
            background: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo">TULIVERSE</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search movies/series..." onkeyup="searchContent()">
            </div>
        </div>
        
        <div class="filters-container">
            <div class="categories">
                <button class="cat-btn active" onclick="setCategory('all', this)">🔥 All Trending</button>
                <button class="cat-btn" onclick="setCategory('bollywood', this)">🎬 Bollywood</button>
                <button class="cat-btn" onclick="setCategory('bengali', this)">🎭 Tollywood</button>
                <button class="cat-btn" onclick="setCategory('series', this)">📺 Web Series</button>
                <button class="cat-btn" onclick="setCategory('hollywood', this)">🍿 Hollywood</button>
            </div>

            <div class="years">
                <button class="year-btn active" onclick="setYear('', this)">All Years</button>
                <button class="year-btn" onclick="setYear('2026', this)">2026</button>
                <button class="year-btn" onclick="setYear('2025', this)">2025</button>
                <button class="year-btn" onclick="setYear('2024', this)">2024</button>
                <button class="year-btn" onclick="setYear('2023', this)">2023</button>
                <button class="year-btn" onclick="setYear('2022', this)">2022</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle">Trending Movies & Series</h2>
        <div class="grid" id="movieGrid"></div>

        <div class="pagination">
            <button class="page-btn" onclick="changePage(-1)">❮ Prev</button>
            <span class="page-info" id="pageNumber">Page 1</span>
            <button class="page-btn" onclick="changePage(1)">Next ❯</button>
        </div>
    </div>

    <!-- Scrollable Modal Window -->
    <div class="modal" id="playerModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="player-header">
                    <div class="player-title" id="playerMediaTitle">Watch Online</div>
                    <span class="close-btn" onclick="closePlayer()">&times;</span>
                </div>

                <!-- Verified Working Stream Servers -->
                <div class="server-top-bar">
                    <button class="srv-btn active" onclick="changeServer('2embed', this)">⚡ Server 1 (2Embed Main)</button>
                    <button class="srv-btn" onclick="changeServer('vidsrc_pm', this)">⚡ Server 2 (VidSrc PM)</button>
                    <button class="srv-btn" onclick="changeServer('embedsu', this)">⚡ Server 3 (EmbedSu HD)</button>
                </div>

                <!-- Video Player Frame -->
                <div class="iframe-container">
                    <iframe id="videoFrame" src="" allowfullscreen></iframe>
                </div>

                <!-- Episode Picker Grid -->
                <div class="episodes-section" id="episodesSection">
                    <div class="episodes-title">Select Episode:</div>
                    <div class="episode-grid" id="episodeGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'e64b892cb94d9ddd0616e9998422ed9a';
        const READ_ACCESS_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlNjRiODkyY2I5NGQ5ZGRkMDYxNmU5OTk4NDIyZWQ5YSIsIm5iZiI6MTc5MzAwNTc1MS40MjIwMDAyLCJzdWIiOiI2YWRmMThiNzA4OWFmMWY4ODFlMWUxM2QiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.AAGzkIhl_V950fMfxr35gfw3Cf9qdVZLOo9pwUAgqwo';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

        const movieGrid = document.getElementById('movieGrid');
        const playerModal = document.getElementById('playerModal');
        const videoFrame = document.getElementById('videoFrame');
        const sectionTitle = document.getElementById('sectionTitle');
        const pageNumber = document.getElementById('pageNumber');
        const playerMediaTitle = document.getElementById('playerMediaTitle');
        const episodesSection = document.getElementById('episodesSection');
        const episodeGrid = document.getElementById('episodeGrid');

        let currentPage = 1;
        let currentCategory = 'all';
        let currentYear = '';
        let currentMediaId = null;
        let currentMediaType = 'movie';
        let currentServer = '2embed';
        let currentEpisode = 1;

        const fetchOptions = {
            method: 'GET',
            headers: {
                accept: 'application/json',
                Authorization: `Bearer ${READ_ACCESS_TOKEN}`
            }
        };

        function buildApiUrl(page) {
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc`;

            if (currentCategory === 'bollywood') {
                url += `&with_original_language=hi`;
            } else if (currentCategory === 'bengali') {
                url += `&with_original_language=bn`;
            } else if (currentCategory === 'hollywood') {
                url += `&with_original_language=en`;
            } else if (currentCategory === 'series') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc`;
            } else if (currentCategory === 'all' && !currentYear) {
                url = `https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&page=${page}`;
            }

            if (currentYear) {
                url += (currentCategory === 'series' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            }

            return url;
        }

        async function getContent() {
            try {
                const apiPageStart = (currentPage - 1) * 2 + 1;
                const p1 = fetch(buildApiUrl(apiPageStart), fetchOptions).then(r => r.json());
                const p2 = fetch(buildApiUrl(apiPageStart + 1), fetchOptions).then(r => r.json());

                const [d1, d2] = await Promise.all([p1, p2]);
                let combined = [...(d1.results || []), ...(d2.results || [])];
                
                showContent(combined.slice(0, 50));
                pageNumber.innerText = `Page ${currentPage}`;
            } catch (error) {
                console.error("Error fetching content: ", error);
            }
        }

        function showContent(items) {
            movieGrid.innerHTML = '';
            if(!items || items.length === 0) {
                movieGrid.innerHTML = '<p style="color: #9ca3af; grid-column: 1/-1;">No content found.</p>';
                return;
            }

            items.forEach(item => {
                const { id, title, name, poster_path, vote_average, media_type } = item;
                if(!poster_path) return;
                
                const itemTitle = title || name;
                const type = media_type || (currentCategory === 'series' ? 'tv' : 'movie');

                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `
                    <span class="type-badge">${type === 'tv' ? 'Series' : 'Movie'}</span>
                    <img src="${IMG_PATH + poster_path}" alt="${itemTitle}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${itemTitle}</div>
                        <div class="card-rating">⭐ ${vote_average ? vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                card.onclick = () => openPlayer(id, type, itemTitle);
                movieGrid.appendChild(card);
            });
        }

        function setCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            currentCategory = category;
            currentPage = 1;
            getContent();
        }

        function setYear(year, btnElement) {
            document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            currentYear = year;
            currentPage = 1;
            getContent();
        }

        function changePage(step) {
            if (currentPage + step >= 1) {
                currentPage += step;
                getContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function openPlayer(id, type, title) {
            currentMediaId = id;
            currentMediaType = type;
            currentEpisode = 1;
            playerMediaTitle.innerText = title ? `${title}` : "Watch Online";
            
            currentServer = '2embed';
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.srv-btn').classList.add('active');

            if (type === 'tv') {
                episodesSection.style.display = 'block';
                generateEpisodes();
            } else {
                episodesSection.style.display = 'none';
            }

            loadVideoSource();
            playerModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function generateEpisodes() {
            episodeGrid.innerHTML = '';
            for (let i = 1; i <= 24; i++) {
                const btn = document.createElement('button');
                btn.classList.add('ep-btn');
                if (i === currentEpisode) btn.classList.add('active');
                btn.innerText = `Ep ${i}`;
                btn.onclick = () => {
                    currentEpisode = i;
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadVideoSource();
                };
                episodeGrid.appendChild(btn);
            }
        }

        function changeServer(server, btnElement) {
            if(btnElement) {
                document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            currentServer = server;
            loadVideoSource();
        }

        function loadVideoSource() {
            if (currentMediaType === 'tv') {
                if (currentServer === '2embed') {
                    videoFrame.src = `https://www.2embed.cc/embedtv/${currentMediaId}&s=1&e=${currentEpisode}`;
                } else if (currentServer === 'vidsrc_pm') {
                    videoFrame.src = `https://vidsrc.pm/embed/tv/${currentMediaId}/1/${currentEpisode}`;
                } else if (currentServer === 'embedsu') {
                    videoFrame.src = `https://embed.su/embed/tv/${currentMediaId}/1/${currentEpisode}`;
                }
            } else {
                if (currentServer === '2embed') {
                    videoFrame.src = `https://www.2embed.cc/embed/${currentMediaId}`;
                } else if (currentServer === 'vidsrc_pm') {
                    videoFrame.src = `https://vidsrc.pm/embed/movie/${currentMediaId}`;
                } else if (currentServer === 'embedsu') {
                    videoFrame.src = `https://embed.su/embed/movie/${currentMediaId}`;
                }
            }
        }

        function closePlayer() {
            playerModal.style.display = 'none';
            videoFrame.src = '';
            document.body.style.overflow = 'auto';
        }

        function searchContent() {
            const query = document.getElementById('searchInput').value.trim();
            if(query.length > 2) {
                const SEARCH_URL = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                sectionTitle.innerText = `Search Results for "${query}"`;
                
                fetch(SEARCH_URL, fetchOptions)
                    .then(res => res.json())
                    .then(data => showContent(data.results));
            } else if(query.length === 0) {
                sectionTitle.innerText = 'Trending Movies & Series';
                getContent();
            }
        }

        getContent();
    </script>
</body>
</html>
