<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Tuliverse - Stream Movies & Series</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        header { 
            background: #111827; 
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 4%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .logo { font-size: 20px; font-weight: 800; color: #e11d48; letter-spacing: 1px; cursor: pointer; }
        .search-box { width: 100%; max-width: 250px; }
        .search-box input { 
            width: 100%;
            padding: 7px 12px; 
            border-radius: 20px; 
            border: 1px solid #374151; 
            background: #1f2937;
            color: #fff;
            outline: none; 
            font-size: 13px;
        }
        .search-box input:focus { border-color: #e11d48; }

        .filters-container {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filters-container::-webkit-scrollbar { display: none; }
        
        .cat-btn, .year-dropdown-btn {
            background: #1f2937;
            color: #d1d5db;
            border: 1px solid #374151;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .cat-btn.active, .cat-btn:hover, .year-dropdown-btn:hover {
            background: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }

        /* Dropdown Styling */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #1f2937;
            min-width: 150px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            border: 1px solid #374151;
            border-radius: 8px;
            z-index: 200;
            margin-top: 4px;
            overflow: hidden;
        }
        .dropdown-content button {
            color: #d1d5db;
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }
        .dropdown-content button:hover {
            background-color: #e11d48;
            color: #fff;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }

        .container { padding: 12px 2%; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #f3f4f6; padding-left: 4px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        @media (max-width: 360px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        }

        @media (min-width: 480px) and (max-width: 767px) {
            .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
        }

        @media (min-width: 768px) {
            header { padding: 12px 5%; }
            .container { padding: 20px 4%; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        }

        .card { 
            background: #1f2937; 
            border-radius: 6px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.2s; 
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card:hover { transform: translateY(-3px); }
        
        .card img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
            display: block; 
        }

        @media (min-width: 480px) { .card img { height: 170px; } }
        @media (min-width: 768px) { .card img { height: 220px; } }

        .type-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(225, 29, 72, 0.9);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .card-info { padding: 6px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f9fafb; }
        .card-rating { font-size: 10px; color: #fbbf24; margin-top: 2px; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 25px 0 10px 0;
        }
        .page-btn {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        .page-btn:hover { background: #e11d48; border-color: #e11d48; }
        .page-info { font-size: 13px; font-weight: bold; color: #e11d48; }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.93); 
            z-index: 1000; 
            padding: 10px;
            overflow-y: auto;
        }
        .modal-dialog {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100%;
        }
        .modal-content { 
            position: relative; 
            width: 100%; 
            max-width: 920px; 
            background: #0f172a; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #1e293b;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            margin: 15px 0;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .player-title {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }
        .close-btn { 
            color: #94a3b8; 
            font-size: 26px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .close-btn:hover { color: #e11d48; }

        .server-top-bar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            overflow-x: auto;
            white-space: nowrap;
            align-items: center;
        }
        .srv-btn {
            background: #1f2937;
            color: #d1d5db;
            border: 1px solid #374151;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .srv-btn.active {
            background: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }

        .status-badge {
            font-size: 11px;
            color: #fbbf24;
            margin-left: auto;
            font-weight: 600;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .episodes-section {
            padding: 12px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: none;
        }
        .ep-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .season-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        .episodes-title {
            font-size: 13px;
            font-weight: bold;
            color: #f8fafc;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .ep-btn {
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .ep-btn.active, .ep-btn:hover {
            background: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }

        .omdb-info-section {
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }
        .omdb-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            color: #fbbf24;
            font-weight: 600;
        }
        .omdb-plot {
            color: #e2e8f0;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo" onclick="setCategory('all', document.querySelector('.cat-btn'))">TULIVERSE</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search movies/series..." onkeyup="searchContent()">
            </div>
        </div>
        
        <div class="filters-container">
            <button class="cat-btn active" onclick="setCategory('all', this)">🏠 Home</button>

            <!-- Main Movies Dropdown -->
            <div class="dropdown">
                <button class="cat-btn">🍿 Movies ▾</button>
                <div class="dropdown-content">
                    <button onclick="setCategory('trending', this)">🔥 All Trending</button>
                    <button onclick="setCategory('bengali', this)">🪕 Tollywood (Bengali)</button>
                    <button onclick="setCategory('series', this)">📺 Web Series</button>
                    <button onclick="setCategory('adult', this)">🔞 Adult Movies</button>
                </div>
            </div>

            <!-- Top Category Buttons -->
            <button class="cat-btn" onclick="setCategory('hollywood', this)">🎬 Hollywood</button>
            <button class="cat-btn" onclick="setCategory('bollywood', this)">🎭 Bollywood</button>
            <button class="cat-btn" onclick="setCategory('hindi_dubbed', this)">🎧 Hindi Dubbed</button>

            <!-- All Years Filter Dropdown -->
            <div class="dropdown">
                <button class="year-dropdown-btn" id="yearSelectLabel">📅 All Years ▾</button>
                <div class="dropdown-content">
                    <button onclick="setYear('', 'All Years')">All Years</button>
                    <button onclick="setYear('2026', '2026')">2026</button>
                    <button onclick="setYear('2025', '2025')">2025</button>
                    <button onclick="setYear('2024', '2024')">2024</button>
                    <button onclick="setYear('2023', '2023')">2023</button>
                    <button onclick="setYear('2022', '2022')">2022</button>
                    <button onclick="setYear('2021', '2021')">2021</button>
                    <button onclick="setYear('2020', '2020')">2020</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle">Trending Movies & Series</h2>
        <div class="grid" id="movieGrid"></div>

        <div class="pagination">
            <button class="page-btn" onclick="changePage(-1)">❮ Prev</button>
            <span class="page-info" id="pageNumber">Page 1</span>
            <button class="page-btn" onclick="changePage(1)">Next ❯</button>
        </div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="player-header">
                    <div class="player-title" id="playerMediaTitle">Watch Online</div>
                    <span class="close-btn" onclick="closePlayer()">&times;</span>
                </div>

                <div class="server-top-bar">
                    <button class="srv-btn active" id="btn-2embed" onclick="userSelectServer('2embed')">⚡ Server 1</button>
                    <button class="srv-btn" id="btn-multiembed" onclick="userSelectServer('multiembed')">⚡ Server 2</button>
                    <button class="srv-btn" id="btn-vidcore" onclick="userSelectServer('vidcore')">⚡ Server 3</button>
                    <span class="status-badge" id="statusBadge">Connecting...</span>
                </div>

                <div class="iframe-container">
                    <iframe id="videoFrame" src="" allowfullscreen></iframe>
                </div>

                <div class="episodes-section" id="episodesSection">
                    <div class="ep-controls">
                        <span class="episodes-title">Season:</span>
                        <select class="season-select" id="seasonSelect" onchange="onSeasonChange()"></select>
                    </div>
                    <div class="episode-grid" id="episodeGrid"></div>
                </div>

                <div class="omdb-info-section" id="omdbInfoSection" style="display:none;">
                    <div class="omdb-meta" id="omdbMeta"></div>
                    <div class="omdb-plot" id="omdbPlot"></div>
                    <div id="omdbCast"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'e64b892cb94d9ddd0616e9998422ed9a';
        const READ_ACCESS_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlNjRiODkyY2I5NGQ5ZGRkMDYxNmU5OTk4NDIyZWQ5YSIsIm5iZiI6MTc5MzAwNTc1MS40MjIwMDAyLCJzdWIiOiI2YWRmMThiNzA4OWFmMWY4ODFlMWUxM2QiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.AAGzkIhl_V950fMfxr35gfw3Cf9qdVZLOo9pwUAgqwo';
        const OMDB_API_KEY = '17fc936b';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

        const movieGrid = document.getElementById('movieGrid');
        const playerModal = document.getElementById('playerModal');
        const videoFrame = document.getElementById('videoFrame');
        const sectionTitle = document.getElementById('sectionTitle');
        const pageNumber = document.getElementById('pageNumber');
        const playerMediaTitle = document.getElementById('playerMediaTitle');
        const episodesSection = document.getElementById('episodesSection');
        const episodeGrid = document.getElementById('episodeGrid');
        const seasonSelect = document.getElementById('seasonSelect');
        const statusBadge = document.getElementById('statusBadge');
        
        const omdbInfoSection = document.getElementById('omdbInfoSection');
        const omdbMeta = document.getElementById('omdbMeta');
        const omdbPlot = document.getElementById('omdbPlot');
        const omdbCast = document.getElementById('omdbCast');

        let currentPage = 1;
        let currentCategory = 'all';
        let currentYear = '';
        let currentMediaId = null;
        let currentMediaType = 'movie';

        const serverList = ['2embed', 'multiembed', 'vidcore'];
        let currentServerIndex = 0;
        let fallbackTimer = null;
        
        let currentSeason = 1;
        let currentEpisode = 1;
        let showSeasonsData = [];

        const fetchOptions = {
            method: 'GET',
            headers: {
                accept: 'application/json',
                Authorization: `Bearer ${READ_ACCESS_TOKEN}`
            }
        };

        function buildApiUrl(page) {
            let url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc`;

            if (currentCategory === 'bollywood') {
                url += `&with_original_language=hi`;
            } else if (currentCategory === 'hindi_dubbed') {
                url += `&with_keywords=210024|155239`;
            } else if (currentCategory === 'bengali') {
                url += `&with_original_language=bn`;
            } else if (currentCategory === 'hollywood') {
                url += `&with_original_language=en`;
            } else if (currentCategory === 'adult') {
                url += `&include_adult=true&with_genres=18,10749`;
            } else if (currentCategory === 'series') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc`;
            } else if ((currentCategory === 'all' || currentCategory === 'trending') && !currentYear) {
                url = `https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&page=${page}`;
            }

            if (currentYear) {
                url += (currentCategory === 'series' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            }

            return url;
        }

        async function getContent() {
            try {
                const apiPageStart = (currentPage - 1) * 2 + 1;
                const p1 = fetch(buildApiUrl(apiPageStart), fetchOptions).then(r => r.json());
                const p2 = fetch(buildApiUrl(apiPageStart + 1), fetchOptions).then(r => r.json());

                const [d1, d2] = await Promise.all([p1, p2]);
                let combined = [...(d1.results || []), ...(d2.results || [])];
                
                showContent(combined.slice(0, 50));
                pageNumber.innerText = `Page ${currentPage}`;
            } catch (error) {
                console.error("Error fetching content: ", error);
            }
        }

        function showContent(items) {
            movieGrid.innerHTML = '';
            if(!items || items.length === 0) {
                movieGrid.innerHTML = '<p style="color: #9ca3af; grid-column: 1/-1;">No content found.</p>';
                return;
            }

            items.forEach(item => {
                const { id, title, name, poster_path, vote_average, media_type } = item;
                if(!poster_path) return;
                
                const itemTitle = title || name;
                const type = media_type || (currentCategory === 'series' ? 'tv' : 'movie');

                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `
                    <span class="type-badge">${type === 'tv' ? 'Series' : 'Movie'}</span>
                    <img src="${IMG_PATH + poster_path}" alt="${itemTitle}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${itemTitle}</div>
                        <div class="card-rating">⭐ ${vote_average ? vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                card.onclick = () => openPlayer(id, type, itemTitle);
                movieGrid.appendChild(card);
            });
        }

        function setCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement && btnElement.tagName === 'BUTTON') btnElement.classList.add('active');
            
            currentCategory = category;
            currentPage = 1;
            getContent();
        }

        function setYear(year, label) {
            currentYear = year;
            document.getElementById('yearSelectLabel').innerText = `📅 ${label} ▾`;
            currentPage = 1;
            getContent();
        }

        function changePage(step) {
            if (currentPage + step >= 1) {
                currentPage += step;
                getContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function fetchOmdbDataByQuery(title, imdbId = '') {
            try {
                let queryUrl = imdbId 
                    ? `https://www.omdbapi.com/?i=${imdbId}&apikey=${OMDB_API_KEY}`
                    : `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_API_KEY}`;
                
                const res = await fetch(queryUrl);
                const data = await res.json();
                
                if (data.Response === "True") {
                    omdbInfoSection.style.display = 'block';
                    const rtRating = data.Ratings?.find(r => r.Source === "Rotten Tomatoes")?.Value || 'N/A';
                    omdbMeta.innerHTML = `
                        <span>⭐ IMDb: ${data.imdbRating || 'N/A'}</span>
                        <span>🍅 Rotten Tomatoes: ${rtRating}</span>
                        <span>📅 Released: ${data.Released || 'N/A'}</span>
                        <span>⏱️ Runtime: ${data.Runtime || 'N/A'}</span>
                        <span>🎭 Genre: ${data.Genre || 'N/A'}</span>
                    `;
                    omdbPlot.innerHTML = `<strong>Plot:</strong> ${data.Plot || 'N/A'}`;
                    omdbCast.innerHTML = `<strong>Director:</strong> ${data.Director || 'N/A'} | <strong>Cast:</strong> ${data.Actors || 'N/A'}`;
                } else {
                    omdbInfoSection.style.display = 'none';
                }
            } catch (e) {
                console.error("OMDb API error: ", e);
                omdbInfoSection.style.display = 'none';
            }
        }

        async function fetchImdbIdAndOmdb(id, type, title) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}/external_ids?api_key=${API_KEY}`, fetchOptions);
                const data = await res.json();
                if (data && data.imdb_id) {
                    fetchOmdbDataByQuery(title, data.imdb_id);
                } else {
                    fetchOmdbDataByQuery(title);
                }
            } catch (e) {
                console.error("External IDs fetch error: ", e);
                fetchOmdbDataByQuery(title);
            }
        }

        async function openPlayer(id, type, title) {
            currentMediaId = id;
            currentMediaType = type;
            currentSeason = 1;
            currentEpisode = 1;
            currentServerIndex = 0;
            playerMediaTitle.innerText = title ? `${title}` : "Watch Online";

            fetchImdbIdAndOmdb(id, type, title);

            if (type === 'tv') {
                episodesSection.style.display = 'block';
                await fetchTVDetails(id);
            } else {
                episodesSection.style.display = 'none';
            }

            loadVideoSource();
            playerModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function fetchTVDetails(tvId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${API_KEY}`, fetchOptions);
                const data = await res.json();
                
                showSeasonsData = data.seasons ? data.seasons.filter(s => s.season_number > 0) : [];
                seasonSelect.innerHTML = '';

                if (showSeasonsData.length === 0) {
                    showSeasonsData = [{ season_number: 1, episode_count: 20 }];
                }

                showSeasonsData.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season_number;
                    opt.innerText = `Season ${s.season_number} (${s.episode_count} Eps)`;
                    seasonSelect.appendChild(opt);
                });

                currentSeason = showSeasonsData[0].season_number;
                renderEpisodesGrid(showSeasonsData[0].episode_count);
            } catch (err) {
                console.error("TV Metadata error: ", err);
                renderEpisodesGrid(20);
            }
        }

        function onSeasonChange() {
            currentSeason = parseInt(seasonSelect.value);
            const seasonObj = showSeasonsData.find(s => s.season_number === currentSeason);
            const epCount = seasonObj ? seasonObj.episode_count : 20;
            currentEpisode = 1;
            renderEpisodesGrid(epCount);
            loadVideoSource();
        }

        function renderEpisodesGrid(count) {
            episodeGrid.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const btn = document.createElement('button');
                btn.classList.add('ep-btn');
                if (i === currentEpisode) btn.classList.add('active');
                btn.innerText = `Ep ${i}`;
                btn.onclick = () => {
                    currentEpisode = i;
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadVideoSource();
                };
                episodeGrid.appendChild(btn);
            }
        }

        function userSelectServer(serverName) {
            currentServerIndex = serverList.indexOf(serverName);
            loadVideoSource();
        }

        function updateServerUI(serverName) {
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${serverName}`);
            if(activeBtn) activeBtn.classList.add('active');
        }

        function loadVideoSource() {
            if (fallbackTimer) clearTimeout(fallbackTimer);
            
            const serverName = serverList[currentServerIndex];
            updateServerUI(serverName);

            statusBadge.style.color = '#fbbf24';
            statusBadge.innerText = `Connecting Server ${currentServerIndex + 1}...`;

            let srcUrl = '';

            if (currentMediaType === 'tv') {
                if (serverName === '2embed') {
                    srcUrl = `https://www.2embed.cc/embedtv/${currentMediaId}&s=${currentSeason}&e=${currentEpisode}`;
                } else if (serverName === 'multiembed') {
                    srcUrl = `https://multiembed.mov/?video_id=${currentMediaId}&tmdb=1&s=${currentSeason}&e=${currentEpisode}`;
                } else if (serverName === 'vidcore') {
                    srcUrl = `https://vidcore.org/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}`;
                }
            } else {
                if (serverName === '2embed') {
                    srcUrl = `https://www.2embed.cc/embed/${currentMediaId}`;
                } else if (serverName === 'multiembed') {
                    srcUrl = `https://multiembed.mov/?video_id=${currentMediaId}&tmdb=1`;
                } else if (serverName === 'vidcore') {
                    srcUrl = `https://vidcore.org/embed/movie/${currentMediaId}`;
                }
            }

            videoFrame.src = srcUrl;

            fallbackTimer = setTimeout(() => {
                if (currentServerIndex < serverList.length - 1) {
                    statusBadge.style.color = '#ef4444';
                    statusBadge.innerText = `Server ${currentServerIndex + 1} Offline! Auto Redirecting...`;
                    currentServerIndex++;
                    setTimeout(() => loadVideoSource(), 1000);
                } else {
                    statusBadge.style.color = '#10b981';
                    statusBadge.innerText = `Connected`;
                }
            }, 5000);
        }

        videoFrame.onload = function() {
            if (fallbackTimer) clearTimeout(fallbackTimer);
            statusBadge.style.color = '#10b981';
            statusBadge.innerText = `Connected`;
        };

        function closePlayer() {
            if (fallbackTimer) clearTimeout(fallbackTimer);
            playerModal.style.display = 'none';
            videoFrame.src = '';
            omdbInfoSection.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function searchContent() {
            const query = document.getElementById('searchInput').value.trim();
            if(query.length > 2) {
                const SEARCH_URL = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                sectionTitle.innerText = `Search Results for "${query}"`;
                
                fetch(SEARCH_URL, fetchOptions)
                    .then(res => res.json())
                    .then(data => showContent(data.results));
            } else if(query.length === 0) {
                sectionTitle.innerText = 'Trending Movies & Series';
                getContent();
            }
        }

        getContent();
    </script>
</body>
</html>
