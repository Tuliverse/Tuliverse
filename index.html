<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>TULI VERSE - Live Streaming</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .player-wrapper {
            max-width: 900px;
            margin: 0 auto 25px auto;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            aspect-ratio: 16 / 9;
            border: 1px solid #1e293b;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .search-container {
            max-width: 1100px;
            margin: 0 auto 20px auto;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .channel-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            user-select: none;
        }

        .channel-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            background: #0f172a;
        }

        .channel-card img {
            width: 100%;
            height: 65px;
            object-fit: contain;
            margin-bottom: 8px;
            background: #0f172a;
            border-radius: 6px;
            padding: 4px;
        }

        .channel-card p {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
                gap: 10px;
            }
            .channel-card img {
                height: 50px;
            }
            .channel-card p {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>TULIVERSE</h1>
        <p id="status">Loading Channels...</p>
    </div>

    <div class="player-wrapper">
        <video id="main-player" controls autoplay crossorigin="anonymous" playsinline></video>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="Search your channel...">
    </div>

        const video = document.getElementById('main-player');
        const grid = document.getElementById('channel-grid');
        const status = document.getElementById('status');
        const searchInput = document.getElementById('search-input');
        
        let allChannels = [];
        let hlsPlayer = null;

        function playStream(url) {
            if (url.startsWith('http://')) {
                url = url.replace('http://', 'https://');
            }

            if (hlsPlayer) {
                hlsPlayer.destroy();
            }

            if (Hls.isSupported()) {
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => {
                        console.log("Autoplay blocked, enabling mute mode:", e);
                        video.muted = true;
                        video.play();
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/100?text=TV';
                    
                    const nameSplit = line.split(',');
                    const name = nameSplit.length > 1 ? nameSplit[nameSplit.length - 1].trim() : 'Live Channel';

                    currentChannel = { name, logo };
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            }
            return channels;
        }

        function renderChannels(channels) {
            grid.innerHTML = '';
            if (channels.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#94a3b8;">No channels found.</p>';
                return;
            }

            channels.forEach((ch) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/100?text=TV'" alt="${ch.name}">
                    <p>${ch.name}</p>
                `;
                card.onclick = () => {
                    video.muted = false;
                    playStream(ch.url);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                grid.appendChild(card);
            });
        }

        function initChannels() {
            allChannels = parseM3U(M3U_RAW_DATA);
            status.innerText = `Total ${allChannels.length} Channels Available`;
            renderChannels(allChannels);

            if (allChannels.length > 0) {
                playStream(allChannels[0].url);
            }
        }

        initChannels();

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        });
