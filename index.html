<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineplexBD - Unlimited All Movies & Series</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0e12;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* Navbar */
    header {
      background: #151821;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #e50914;
      text-decoration: none;
      letter-spacing: 1px;
    }
    .logo span {
      color: #fff;
    }
    .search-box {
      display: flex;
      gap: 5px;
      width: 100%;
      max-width: 450px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #2a2e3d;
      background: #0d0e12;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }
    .search-box button {
      padding: 10px 20px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .search-box button:hover {
      background: #b80710;
    }

    /* Navigation Category Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0 10px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 8px 18px;
      background: #151821;
      border: 1px solid #2a2e3d;
      color: #aaa;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.3s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    /* Container */
    .container {
      padding: 10px 5% 40px;
    }
    .section-title {
      font-size: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #e50914;
      padding-left: 10px;
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .movie-card {
      background: #151821;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      border: 1px solid #222634;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.4);
    }
    .movie-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .movie-info {
      padding: 10px;
      text-align: center;
    }
    .movie-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-type {
      font-size: 11px;
      color: #e50914;
      margin-top: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Load More Button */
    .load-more-btn {
      display: block;
      margin: 30px auto;
      padding: 12px 30px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Video Modal (Popup Player) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      width: 90%;
      max-width: 950px;
      background: #151821;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 30px;
      color: #fff;
      cursor: pointer;
      z-index: 1001;
    }
    .player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }
    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <a href="#" class="logo" onclick="switchCategory('trending')">CINEPLEX<span>BD</span></a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="যেকোনো মুভি বা সিরিজের নাম লিখুন...">
      <button onclick="searchContent()">Search</button>
    </div>
  </header>

  <!-- Navigation Category Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-trending" onclick="switchCategory('trending')">🔥 Trending All</button>
    <button class="tab-btn" id="tab-movie" onclick="switchCategory('movie')">🎬 Movies</button>
    <button class="tab-btn" id="tab-tv" onclick="switchCategory('tv')">📺 TV Series</button>
  </div>

  <!-- Content Section -->
  <div class="container">
    <h2 class="section-title" id="headingText">Trending Content</h2>
    <div class="movie-grid" id="movieContainer">
      <p style="grid-column: 1/-1; text-align: center;">লোডিং হচ্ছে...</p>
    </div>
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Load More Movies</button>
  </div>

  <!-- Video Player Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closePlayer()">&times;</span>
      <div class="player-container">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const apiKey = '15d2ea6d0dc1d476efb2532d8b1b5120';
    const container = document.getElementById('movieContainer');
    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoPlayer');
    
    let currentPage = 1;
    let currentCategory = 'trending';
    let searchQuery = '';

    window.onload = function() {
      fetchData();
    };

    function switchCategory(category) {
      currentCategory = category;
      currentPage = 1;
      searchQuery = '';
      document.getElementById('searchInput').value = '';

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if(document.getElementById(`tab-${category}`)) {
        document.getElementById(`tab-${category}`).classList.add('active');
      }

      document.getElementById('headingText').innerText = 
        category === 'trending' ? 'Trending Content' : 
        category === 'movie' ? 'Popular Movies' : 'Popular TV Series';

      container.innerHTML = '';
      fetchData();
    }

    function searchContent() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      currentCategory = 'search';
      searchQuery = query;
      currentPage = 1;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('headingText').innerText = `Search Results for: ${query}`;
      
      container.innerHTML = '';
      fetchData();
    }

    function fetchData() {
      let url = '';

      if (currentCategory === 'trending') {
        url = `https://api.themoviedb.org/3/trending/all/day?api_key=${apiKey}&page=${currentPage}&include_adult=true`;
      } else if (currentCategory === 'movie') {
        url = `https://api.themoviedb.org/3/movie/popular?api_key=${apiKey}&page=${currentPage}&include_adult=true`;
      } else if (currentCategory === 'tv') {
        url = `https://api.themoviedb.org/3/tv/popular?api_key=${apiKey}&page=${currentPage}&include_adult=true`;
      } else if (currentCategory === 'search') {
        url = `https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${encodeURIComponent(searchQuery)}&page=${currentPage}&include_adult=true`;
      }

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.results || data.results.length === 0) {
            if(currentPage === 1) {
              container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">কোনো কন্টেন্ট পাওয়া যায়নি!</p>';
            }
            document.getElementById('loadMoreBtn').style.display = 'none';
            return;
          }

          document.getElementById('loadMoreBtn').style.display = 'block';

          data.results.forEach(item => {
            const title = item.title || item.name;
            const mediaType = item.media_type || (currentCategory === 'tv' ? 'tv' : 'movie');
            const poster = item.poster_path 
              ? `https://image.tmdb.org/t/p/w500${item.poster_path}` 
              : 'https://via.placeholder.com/500x750?text=No+Poster';

            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(mediaType, item.id);

            card.innerHTML = `
              <img src="${poster}" alt="${title}">
              <div class="movie-info">
                <div class="movie-title">${title}</div>
                <div class="movie-type">${mediaType}</div>
              </div>
            `;

            container.appendChild(card);
          });
        })
        .catch(() => {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">ডাটা লোড করতে সমস্যা হয়েছে!</p>';
        });
    }

    function loadMore() {
      currentPage++;
      fetchData();
    }

    function openPlayer(type, id) {
      const embedUrl = type === 'tv'
        ? `https://vidsrc.to/embed/tv/${id}`
        : `https://vidsrc.to/embed/movie/${id}`;
      
      player.src = embedUrl;
      modal.style.display = 'flex';
    }

    function closePlayer() {
      modal.style.display = 'none';
      player.src = '';
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') searchContent();
    });
  </script>

</body>
</html>
