                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc`;
            } else if (currentCategory === 'indian_webseries') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc&with_original_language=hi`;
            } else if (currentCategory === 'kdrama') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc&with_original_language=ko`;
            } else if (currentCategory === 'cdrama') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc&with_original_language=zh`;
            } else if (currentCategory === 'south_indian') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc&with_original_language=te|ta|ml|kn`;
            } else if (currentCategory === 'hot_series') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc&with_genres=18,10749&include_adult=true`;
            } else if (currentCategory === 'indian_hot_series') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc&with_genres=18,10749&with_original_language=hi&include_adult=true`;
            } else {
                if (currentYear) {
                    url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&page=${page}&sort_by=popularity.desc`;
                } else {
                    url = `https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&page=${page}`;
                }
            }

            if (currentYear) {
                const isTvCategory = ['webseries', 'indian_webseries', 'kdrama', 'cdrama', 'hindi_dubbed_anime_series', 'hot_series', 'indian_hot_series'].includes(currentCategory);
                url += isTvCategory ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`;
            }

            return url;
        }

        async function getContent() {
            if (currentCategory === 'indian_reality_shows') {
                fetchFirebaseRealityShows();
                return;
            }
            paginationSection.style.display = 'flex';

            try {
                const apiPageStart = (currentPage - 1) * 2 + 1;
                const p1 = fetch(buildApiUrl(apiPageStart), fetchOptions).then(r => r.json());
                const p2 = fetch(buildApiUrl(apiPageStart + 1), fetchOptions).then(r => r.json());

                const [d1, d2] = await Promise.all([p1, p2]);
                let combined = [...(d1.results || []), ...(d2.results || [])];
                
                showContent(combined.slice(0, 50));
                pageNumber.innerText = `Page ${currentPage}`;
            } catch (error) {
                console.error("Error fetching content: ", error);
            }
        }

        async function fetchFirebaseRealityShows() {
            movieGrid.innerHTML = '<p style="color: #fbbf24; grid-column: 1/-1; padding: 20px;">Loading Reality Shows from Database...</p>';
            paginationSection.style.display = 'none';

            try {
                const res = await fetch(`${FIREBASE_URL}.json`);
                const data = await res.json();
                
                movieGrid.innerHTML = '';
                if (!data) {
                    movieGrid.innerHTML = '<p style="color: #9ca3af; grid-column: 1/-1; padding: 20px;">No shows available right now.</p>';
                    return;
                }

                const showMetadata = {
                    "bigg_boss": { title: "Bigg Boss", poster: "https://image.tmdb.org/t/p/w500/oO34iO3J88kZllfO6wNlKInG0E9.jpg" },
                    "splitsvilla": { title: "MTV Splitsvilla", poster: "https://image.tmdb.org/t/p/w500/8X2cK5E25uS4sM6iJ2zYkY9u48z.jpg" },
                    "roadies": { title: "MTV Roadies", poster: "https://image.tmdb.org/t/p/w500/A31f4oR57Jk7j72061g866e4a6y.jpg" },
                    "mtv_hustle": { title: "MTV Hustle", poster: "https://image.tmdb.org/t/p/w500/yZ4O0Gf01v51859w7vC3fKInG0E.jpg" },
                    "bigg_boss_bangla": { title: "Bigg Boss Bangla", poster: "https://image.tmdb.org/t/p/w500/oO34iO3J88kZllfO6wNlKInG0E9.jpg" },
                    "anupama": { title: "Anupamaa", poster: "https://image.tmdb.org/t/p/w500/9R38L4v33g4kI09g8zY2Z15K3k4.jpg" }
                };

                Object.keys(data).forEach(showKey => {
                    const showData = data[showKey];
                    const meta = showMetadata[showKey] || { title: showKey.replace(/_/g, ' ').toUpperCase(), poster: 'https://via.placeholder.com/500x750?text=No+Poster' };

                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.innerHTML = `
                        <span class="type-badge">Reality Show</span>
                        <img src="${meta.poster}" alt="${meta.title}" onerror="this.src='https://via.placeholder.com/500x750?text=${meta.title}'">
                        <div class="card-info">
                            <div class="card-title">${meta.title}</div>
                            <div class="card-rating">⭐ Latest Episodes</div>
                        </div>
                    `;
                    card.onclick = () => openFirebasePlayer(showKey, meta.title, showData.episodes);
                    movieGrid.appendChild(card);
                });

            } catch (err) {
                console.error("Firebase fetch error:", err);
                movieGrid.innerHTML = '<p style="color: #ef4444; grid-column: 1/-1; padding: 20px;">Failed to load shows.</p>';
            }
        }

        function showContent(items) {
            movieGrid.innerHTML = '';
            if(!items || items.length === 0) {
                movieGrid.innerHTML = '<p style="color: #9ca3af; grid-column: 1/-1; padding: 20px;">No content found.</p>';
                return;
            }

            items.forEach(item => {
                const { id, title, name, poster_path, vote_average, media_type } = item;
                if(!poster_path) return;
                
                const itemTitle = title || name;
                const isTvSeries = (media_type === 'tv') || ['webseries', 'indian_webseries', 'kdrama', 'cdrama', 'hindi_dubbed_anime_series', 'hot_series', 'indian_hot_series'].includes(currentCategory);
                const type = isTvSeries ? 'tv' : 'movie';

                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `
                    <span class="type-badge">${type === 'tv' ? 'Series' : 'Movie'}</span>
                    <img src="${IMG_PATH + poster_path}" alt="${itemTitle}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${itemTitle}</div>
                        <div class="card-rating">⭐ ${vote_average ? vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                card.onclick = () => openPlayer(id, type, itemTitle);
                movieGrid.appendChild(card);
            });
        }

        function setCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            
            if(category === 'all') document.getElementById('btn-all')?.classList.add('active');
            if(category === 'hollywood') document.getElementById('btn-hollywood')?.classList.add('active');
            if(category === 'bollywood') document.getElementById('btn-bollywood')?.classList.add('active');
            if(category === 'bengali') document.getElementById('btn-bengali')?.classList.add('active');
            if(category.includes('webseries') || category.includes('reality_shows') || category === 'kdrama' || category === 'cdrama') document.getElementById('btn-webseries')?.classList.add('active');
            if(category === 'south_indian') document.getElementById('btn-south_indian')?.classList.add('active');
            if(category.includes('hot_series')) document.getElementById('btn-hot_series')?.classList.add('active');
            if(category.startsWith('hindi_dubbed')) document.getElementById('btn-hindi_dubbed')?.classList.add('active');

            const titleMap = {
                'all': 'Trending Movies & Series',
                'hollywood': '🎬 Hollywood Movies',
                'bollywood': '🎭 Bollywood Movies',
                'bengali': '🪕 Tollywood / Bengali Movies',
                'webseries': '📺 All Web Series',
                'indian_webseries': '🇮🇳 Indian Web Series',
                'indian_reality_shows': '🎙️ Indian Reality Shows',
                'kdrama': '🇰🇷 Korean Drama (K-Drama)',
                'cdrama': '🇨🇳 Chinese Drama (C-Drama)',
                'south_indian': '🍿 South Indian Dubbed Movies',
                'hot_series': '🔥 Hot Web Series',
                'indian_hot_series': '🇮🇳 Indian Hot Web Series',
                'hindi_dubbed_anime_movie': '⛩️ Hindi Dubbed Anime Movies',
                'hindi_dubbed_anime_series': '⛩️ Hindi Dubbed Anime Series'
            };

            sectionTitle.innerText = titleMap[category] || 'Explore Movies & Series';
            currentCategory = category;
            currentPage = 1;
            getContent();
        }

        function setYear(year, label) {
            currentYear = year;
            document.getElementById('yearSelectLabel').innerText = `📅 ${label} ▾`;
            currentPage = 1;
            getContent();
        }

        function changePage(step) {
            if (currentPage + step >= 1) {
                currentPage += step;
                getContent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function fetchOmdbDataByQuery(title, imdbId = '') {
            try {
                let queryUrl = imdbId 
                    ? `https://www.omdbapi.com/?i=${imdbId}&apikey=${OMDB_API_KEY}`
                    : `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_API_KEY}`;
                
                const res = await fetch(queryUrl);
                const data = await res.json();
                
                if (data.Response === "True") {
                    omdbInfoSection.style.display = 'block';
                    const rtRating = data.Ratings?.find(r => r.Source === "Rotten Tomatoes")?.Value || 'N/A';
                    omdbMeta.innerHTML = `
                        <span>⭐ IMDb: ${data.imdbRating || 'N/A'}</span>
                        <span>🍅 Rotten Tomatoes: ${rtRating}</span>
                        <span>📅 Released: ${data.Released || 'N/A'}</span>
                        <span>⏱️ Runtime: ${data.Runtime || 'N/A'}</span>
                        <span>🎭 Genre: ${data.Genre || 'N/A'}</span>
                    `;
                    omdbPlot.innerHTML = `<strong>Plot:</strong> ${data.Plot || 'N/A'}`;
                    omdbCast.innerHTML = `<strong>Director:</strong> ${data.Director || 'N/A'} | <strong>Cast:</strong> ${data.Actors || 'N/A'}`;
                } else {
                    omdbInfoSection.style.display = 'none';
                }
            } catch (e) {
                console.error("OMDb API error: ", e);
                omdbInfoSection.style.display = 'none';
            }
        }

        async function fetchImdbIdAndOmdb(id, type, title) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}/external_ids?api_key=${API_KEY}`, fetchOptions);
                const data = await res.json();
                if (data && data.imdb_id) {
                    fetchOmdbDataByQuery(title, data.imdb_id);
                } else {
                    fetchOmdbDataByQuery(title);
                }
            } catch (e) {
                console.error("External IDs fetch error: ", e);
                fetchOmdbDataByQuery(title);
            }
        }

        function openFirebasePlayer(showKey, title, episodes) {
            isFirebaseShow = true;
            serverTopBar.style.display = 'none';
            playerMediaTitle.innerText = title;
            episodesSection.style.display = 'block';
            seasonSelect.style.display = 'none';
            epControlsTitle.innerText = "Available Episode Servers / Parts:";
            
            episodeGrid.innerHTML = '';
            
            if (episodes) {
                Object.keys(episodes).forEach((epKey, index) => {
                    const ep = episodes[epKey];
                    const btn = document.createElement('button');
                    btn.classList.add('ep-btn');
                    if (index === 0) btn.classList.add('active');
                    btn.innerText = ep.title || `Part ${index + 1}`;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        videoFrame.src = ep.stream_link;
                    };
                    episodeGrid.appendChild(btn);

                    if (index === 0) {
                        videoFrame.src = ep.stream_link;
                    }
                });
            } else {
                episodeGrid.innerText = "No episodes currently available.";
            }

            fetchOmdbDataByQuery(title);
            playerModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function openPlayer(id, type, title) {
            isFirebaseShow = false;
            serverTopBar.style.display = 'flex';
            seasonSelect.style.display = 'inline-block';
            epControlsTitle.innerText = "Season:";

            currentMediaId = id;
            currentMediaType = type;
            currentSeason = 1;
            currentEpisode = 1;
            currentServerIndex = 0;
            playerMediaTitle.innerText = title ? `${title}` : "Watch Online";

            fetchImdbIdAndOmdb(id, type, title);

            if (type === 'tv') {
                episodesSection.style.display = 'block';
                await fetchTVDetails(id);
            } else {
                episodesSection.style.display = 'none';
            }

            loadVideoSource();
            playerModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        async function fetchTVDetails(tvId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${API_KEY}`, fetchOptions);
                const data = await res.json();
                
                showSeasonsData = data.seasons ? data.seasons.filter(s => s.season_number > 0) : [];
                seasonSelect.innerHTML = '';

                if (showSeasonsData.length === 0) {
                    showSeasonsData = [{ season_number: 1, episode_count: 20 }];
                }

                showSeasonsData.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season_number;
                    opt.innerText = `Season ${s.season_number} (${s.episode_count} Eps)`;
                    seasonSelect.appendChild(opt);
                });

                currentSeason = showSeasonsData[0].season_number;
                renderEpisodesGrid(showSeasonsData[0].episode_count);
            } catch (err) {
                console.error("TV Metadata error: ", err);
                renderEpisodesGrid(20);
            }
        }

        function onSeasonChange() {
            currentSeason = parseInt(seasonSelect.value);
            const seasonObj = showSeasonsData.find(s => s.season_number === currentSeason);
            const epCount = seasonObj ? seasonObj.episode_count : 20;
            currentEpisode = 1;
            renderEpisodesGrid(epCount);
            loadVideoSource();
        }

        function renderEpisodesGrid(count) {
            episodeGrid.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const btn = document.createElement('button');
                btn.classList.add('ep-btn');
                if (i === currentEpisode) btn.classList.add('active');
                btn.innerText = `Ep ${i}`;
                btn.onclick = () => {
                    currentEpisode = i;
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadVideoSource();
                };
                episodeGrid.appendChild(btn);
            }
        }

        function userSelectServer(serverName) {
            currentServerIndex = serverList.indexOf(serverName);
            loadVideoSource();
        }

        function updateServerUI(serverName) {
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${serverName}`);
            if(activeBtn) activeBtn.classList.add('active');
        }

        function loadVideoSource() {
            if (isFirebaseShow) return;
            if (fallbackTimer) clearTimeout(fallbackTimer);
            
            const serverName = serverList[currentServerIndex];
            updateServerUI(serverName);

            statusBadge.style.color = '#fbbf24';
            statusBadge.innerText = `Connecting Server ${currentServerIndex + 1}...`;

            if (serverName === 'vidcore') {
                videoFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
            } else {
                videoFrame.removeAttribute('sandbox');
            }

            let srcUrl = '';

            if (currentMediaType === 'tv') {
                if (serverName === '2embed') {
                    srcUrl = `https://www.2embed.cc/embedtv/${currentMediaId}&s=${currentSeason}&e=${currentEpisode}`;
                } else if (serverName === 'multiembed') {
                    srcUrl = `https://multiembed.mov/?video_id=${currentMediaId}&tmdb=1&s=${currentSeason}&e=${currentEpisode}`;
                } else if (serverName === 'vidcore') {
                    srcUrl = `https://vidcore.org/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}`;
                } else if (serverName === 'vidlink') {
                    srcUrl = `https://vidlink.pro/tv/${currentMediaId}/${currentSeason}/${currentEpisode}`;
                }
            } else {
                if (serverName === '2embed') {
                    srcUrl = `https://www.2embed.cc/embed/${currentMediaId}`;
                } else if (serverName === 'multiembed') {
                    srcUrl = `https://multiembed.mov/?video_id=${currentMediaId}&tmdb=1`;
                } else if (serverName === 'vidcore') {
                    srcUrl = `https://vidcore.org/embed/movie/${currentMediaId}`;
                } else if (serverName === 'vidlink') {
                    srcUrl = `https://vidlink.pro/movie/${currentMediaId}`;
                }
            }

            videoFrame.src = srcUrl;

            fallbackTimer = setTimeout(() => {
                if (currentServerIndex < serverList.length - 1) {
                    statusBadge.style.color = '#ef4444';
                    statusBadge.innerText = `Server ${currentServerIndex + 1} Offline! Auto Redirecting...`;
                    currentServerIndex++;
                    setTimeout(() => loadVideoSource(), 1000);
                } else {
                    statusBadge.style.color = '#10b981';
                    statusBadge.innerText = `Connected`;
                }
            }, 5000);
        }

        videoFrame.onload = function() {
            if (fallbackTimer) clearTimeout(fallbackTimer);
            statusBadge.style.color = '#10b981';
            statusBadge.innerText = `Connected`;
        };

        function closePlayer() {
            if (fallbackTimer) clearTimeout(fallbackTimer);
            playerModal.style.display = 'none';
            videoFrame.src = '';
            omdbInfoSection.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function searchContent() {
            const query = document.getElementById('searchInput').value.trim();
            if(query.length > 2) {
                const SEARCH_URL = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                sectionTitle.innerText = `Search Results for "${query}"`;
                
                fetch(SEARCH_URL, fetchOptions)
                    .then(res => res.json())
                    .then(data => showContent(data.results));
            } else if(query.length === 0) {
                sectionTitle.innerText = 'Trending Movies & Series';
                getContent();
            }
        }

        getContent();
    </script>
</body>
</html>
